<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crosswalk Safety System</title>
    <!-- Tailwind CSS for rapid layouting -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='3') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <!-- Futuristic Smart City Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'theme-cream': '#F7FBF4',
                        'theme-sage': '#A4D4A7',
                        'theme-sage-dark': '#6B9A6D',
                        'theme-dusty-blue': '#88A1B0',
                        'theme-dusty-blue-dark': '#5E7B8B',
                        'theme-amber': '#F1D8A4',
                        'theme-amber-dark': '#CFB277',
                        'theme-terracotta': '#D2A17F',
                        'theme-terracotta-dark': '#A56A4F',
                        'theme-bark': '#2F4735',
                        'theme-bark-muted': '#5E7060',
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(127, 167, 135, 0.15)',
                        'glass-hover': '0 12px 48px 0 rgba(127, 167, 135, 0.25)',
                        'glow-live': '0 0 15px rgba(227, 169, 143, 0.6)'
                    }
                }
            }
        }
    </script>
    
    {% block head %}{% endblock %}
</head>
<body class="bg-theme-cream text-gray-800 font-sans selection:bg-theme-dusty-blue selection:text-white transition-colors duration-500">

    {% block content %}{% endblock %}

    <!-- Global Chatbot Component -->
    <div id="chatbot-container">
        <div id="chatbot-window">
            <div class="chat-header">
                <span>Crossy</span>
                <button id="close-chat">&times;</button>
            </div>
            <div class="chat-body" id="chat-body">
                <div class="chat-message bot">Hi! I'm Crossy. How can I help you stay safe today?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ask something...">
                <button id="send-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm-.826-.827L1.442 6.467 13.424 1.87 5.81 9.243Z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div id="chatbot-avatar" class="cursor-pointer flex items-center justify-center bg-gradient-to-tr from-theme-sage-dark to-theme-sage border border-theme-sage/40 rounded-full shadow-lg hover:scale-105 transition-transform" style="width: 70px; height: 70px;" title="Chat with Crossy! Drag me!">
            <svg class="w-10 h-10 text-white pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="6" width="14" height="10" rx="3" fill="currentColor" opacity="0.15"></rect>
                <rect x="5" y="6" width="14" height="10" rx="3"></rect>
                <line x1="12" y1="6" x2="12" y2="3"></line>
                <circle cx="12" cy="2.5" r="1" fill="currentColor"></circle>
                <circle cx="9" cy="11" r="1.5" fill="currentColor"></circle>
                <circle cx="15" cy="11" r="1.5" fill="currentColor"></circle>
                <path d="M10 14h4" stroke-linecap="round"></path>
                <circle cx="7" cy="16" r="2"></circle>
                <circle cx="17" cy="16" r="2"></circle>
            </svg>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
